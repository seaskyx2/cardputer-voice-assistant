esphome:
  name: m5cardputer
  friendly_name: M5Cardputer Adv
  includes:
    - visualizer.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(cardputer_adv_dac)->set_volume(id(cardputer_vol));
          id(last_activity_ms) = millis();
          id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
          id(cardputer_imu)->add_listener([](const esphome::motion::MotionData &d) {
            int g = visualizer::imu_tracker.on_accel(
              d.acceleration[esphome::motion::X_AXIS],
              d.acceleration[esphome::motion::Y_AXIS],
              d.acceleration[esphome::motion::Z_AXIS],
              id(is_sleeping)
            );
            if (g == 1 && id(ui_mode) != 4) {
              id(echo_speaker)->stop();
              if (id(va_state) != 0) {
                id(va_comp)->request_stop();
                id(va_state) = 0;
                id(va_status_msg) = "Ready";
                id(va_stt_text).clear();
                id(va_reply_text).clear();
              }
              id(dialog_reset_active) = false;
              id(alert_active) = false;
              id(vol_hud_active) = false;
              id(is_sleeping) = true;
              id(is_dimmed) = false;
              id(disp_backlight)->turn_off().perform();
            } else if (g == 2) {
              id(last_activity_ms) = millis();
              id(is_sleeping) = false;
              id(is_dimmed) = false;
              id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
              id(m5display).update();
            }
          });
          id(external_mic)->add_data_callback([](const std::vector<uint8_t> &data) {
            visualizer::on_mic_data(data);
          });

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: custom_components
    components: [tca8418_keypad]

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  services:
    - service: notify_alert
      variables:
        title: string
        message: string
      then:
        - lambda: |-
            id(alert_title) = title;
            id(alert_msg) = message;
            id(alert_start_ms) = millis();
            id(alert_dur_ms) = 10000;
            id(alert_active) = true;
            id(last_activity_ms) = millis();
            id(is_sleeping) = false;
            id(is_dimmed) = false;
            id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
            if (id(va_state) == 0 && (title.find("提醒") != std::string::npos || title.find("告警") != std::string::npos)) {
              visualizer::play_chime_dingdong(id(echo_speaker));
            }
            id(m5display).update();
  on_client_connected:
    - lambda: |-
        id(va_state) = 0;
        id(va_status_msg) = "Host Online";
        id(va_error_label) = "";
        id(dialog_reset_active) = false;
        id(m5display).update();
  on_client_disconnected:
    - lambda: |-
        id(va_state) = 4;
        id(va_status_msg) = "Host Disconnected";
        id(va_error_label) = "中枢断开重连中";
        id(va_state_enter_ms) = millis();
        id(dialog_reset_start_ms) = millis();
        id(dialog_reset_dur_ms) = 4000;
        id(dialog_reset_active) = true;
        id(m5display).update();

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Cardputer Fallback Hotspot"
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

globals:
  - id: va_state
    type: int
    initial_value: "0" # 0: Ready, 1: Listening, 2: Thinking, 3: Speaking, 4: Error
  - id: va_state_enter_ms
    type: uint32_t
    initial_value: "0"
  - id: va_error_label
    type: std::string
    initial_value: '"对话异常"'
  - id: va_status_msg
    type: std::string
    initial_value: '"Ready"'
  - id: va_stt_text
    type: std::string
    initial_value: '""'
  - id: va_reply_text
    type: std::string
    initial_value: '""'
  - id: cardputer_vol
    type: float
    initial_value: "0.75"
    restore_value: true
  - id: vol_hud_start_ms
    type: uint32_t
    initial_value: "0"
  - id: vol_hud_active
    type: bool
    initial_value: "false"
  - id: dialog_reset_start_ms
    type: uint32_t
    initial_value: "0"
  - id: dialog_reset_dur_ms
    type: uint32_t
    initial_value: "5000"
  - id: dialog_reset_active
    type: bool
    initial_value: "false"
  - id: batt_pct
    type: int
    initial_value: "100"
  - id: last_activity_ms
    type: uint32_t
    initial_value: "0"
  - id: is_dimmed
    type: bool
    initial_value: "false"
  - id: is_sleeping
    type: bool
    initial_value: "false"
  - id: ui_mode
    type: int
    initial_value: "0" # 0: 语音脉冲, 1: 桌面副屏与备忘, 2: 集群算力雷达, 3: 掌上家电遥控, 4: 双轴电子水平仪
  - id: dev_cursor
    type: int
    initial_value: "0"
  - id: dev_scroll
    type: int
    initial_value: "0"
  - id: target_toggle_entity
    type: std::string
    initial_value: '""'
  - id: dev_action_start_ms
    type: uint32_t
    initial_value: "0"
  - id: dev_action_active
    type: bool
    initial_value: "false"
  - id: alert_title
    type: std::string
    initial_value: '""'
  - id: alert_msg
    type: std::string
    initial_value: '""'
  - id: alert_start_ms
    type: uint32_t
    initial_value: "0"
  - id: alert_dur_ms
    type: uint32_t
    initial_value: "8000"
  - id: alert_active
    type: bool
    initial_value: "false"

