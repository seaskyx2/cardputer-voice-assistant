i2c:
  sda: GPIO08
  scl: GPIO09
  scan: true
  id: bus_internal

audio_dac:
  - platform: es8311
    id: cardputer_adv_dac
    i2c_id: bus_internal
    address: 0x18
    use_mclk: false
    use_microphone: false
    mic_gain: 42DB
    sample_rate: 16000
    bits_per_sample: 32bit

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO43
    i2s_bclk_pin: GPIO41

microphone:
  - platform: i2s_audio
    id: external_mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin:
      number: GPIO46
      ignore_strapping_warning: true
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO42
    channel: mono
    audio_dac: cardputer_adv_dac
    bits_per_sample: 32bit
    sample_rate: 16000

tca8418_keypad:
  id: cardputer_keypad
  i2c_id: bus_internal
  address: 0x34
  rows: 7
  columns: 8
  interrupt_pin: GPIO11
  on_key:
    - if:
        condition:
          lambda: 'return pressed;'
        then:
          - if:
              # ===== 最高优先级 0：黑屏休眠态按任意键仅负责唤醒亮屏（吞掉首键，防误触发对讲）=====
              condition:
                lambda: 'return id(is_sleeping);'
              then:
                - lambda: |-
                    id(last_activity_ms) = millis();
                    id(is_sleeping) = false;
                    id(is_dimmed) = false;
                    id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
                    id(m5display).update();
              else:
                - lambda: |-
                    id(last_activity_ms) = millis();
                    if (id(is_dimmed)) {
                      id(is_dimmed) = false;
                      id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
                    }
                    // 任意键按下时若处于异常态 (va_state == 4)，立刻解除错误锁回待命态
                    if (id(va_state) == 4) {
                      id(va_state) = 0;
                      id(dialog_reset_active) = false;
                      id(va_error_label) = "";
                    }
                - if:
                    # ===== 最高优先级 1：减小音量（按 '-' 键 keycode 55，或 '[' 键 keycode 56）=====
                    condition:
                      lambda: 'return keycode == 55 || keycode == 56 || (row == 5 && col == 4) || (row == 5 && col == 5);'
                    then:
                      - lambda: |-
                          float v = id(cardputer_vol) - 0.05f;
                          if (v < 0.20f) v = 0.20f;
                          id(cardputer_vol) = v;
                          id(cardputer_adv_dac)->set_volume(v);
                          id(vol_hud_start_ms) = millis();
                          id(vol_hud_active) = true;
                          id(m5display).update();
                    else:
                      - if:
                          # ===== 最高优先级 2：增大音量（按 '+' / '=' 键 keycode 61，或 ']' 键 keycode 62）=====
                          condition:
                            lambda: 'return keycode == 61 || keycode == 62 || (row == 6 && col == 0) || (row == 6 && col == 1);'
                          then:
                            - lambda: |-
                                float v = id(cardputer_vol) + 0.05f;
                                if (v > 1.0f) v = 1.0f;
                                id(cardputer_vol) = v;
                                id(cardputer_adv_dac)->set_volume(v);
                                id(vol_hud_start_ms) = millis();
                                id(vol_hud_active) = true;
                                id(m5display).update();
                          else:
                            # ===== 最高优先级 3：切换待机桌面视图 (左侧第一列 ESC/TAB/Fn/Ctrl: row==0, col<=3) =====
                            - if:
                                condition:
                                  lambda: 'return (row == 0 && col <= 3);'
                                then:
                                  - if:
                                      condition:
                                        lambda: 'return id(va_state) != 0;'
                                      then:
                                        - lambda: |-
                                            id(echo_speaker)->stop();
                                        - voice_assistant.stop:
                                  - lambda: |-
                                      id(va_state) = 0;
                                      id(va_status_msg) = "Ready";
                                      id(va_stt_text).clear();
                                      id(va_reply_text).clear();
                                      id(alert_active) = false;
                                      id(dialog_reset_active) = false;
                                      id(ui_mode) = (id(ui_mode) + 1) % 5;
                                      id(m5display).update();
                                else:
                                  # ===== 物理宏键 1 (row=0, col=4)：一键全屋熄灯 =====
                                  - if:
                                      condition:
                                        lambda: 'return (id(va_state) == 0) && (row == 0 && col == 4);'
                                      then:
                                        - homeassistant.service:
                                            service: light.turn_off
                                            data:
                                              entity_id: all
                                        - lambda: |-
                                            id(alert_title) = "物理宏 [1]";
                                            id(alert_msg) = "已下发一键全屋熄灯指令";
                                            id(alert_start_ms) = millis();
                                            id(alert_dur_ms) = 2500;
                                            id(alert_active) = true;
                                            id(m5display).update();
                                      else:
                                        # ===== 快捷键组：宏键 2/3/4/5、第 5 屏回车归零、第 4 屏方向键选设备 =====
                                        - if:
                                            condition:
                                              lambda: |-
                                                if (id(va_state) != 0) return false;
                                                if (row == 1 && col == 0) return true; // 宏键 2: 息屏
                                                if (row == 1 && col == 4) return true; // 宏键 3: 集群雷达
                                                if (row == 2 && col == 0) return true; // 宏键 4: 掌上控家
                                                if (row == 2 && col == 4) return true; // 宏键 5: 电子水平仪
                                                if (id(ui_mode) == 4 && row == 6 && col == 6) return true; // 水平仪回车归零
                                                if (id(ui_mode) == 3) {
                                                  bool is_nav = (row == 5 && col == 6) || (row == 5 && col == 3) ||
                                                                (row == 5 && col == 7) || (row == 6 && col == 3);
                                                  if (is_nav) return true;
                                                }
                                                return false;
                                            then:
                                              - lambda: |-
                                                  if (row == 1 && col == 0) {
                                                    id(echo_speaker)->stop();
                                                    id(is_sleeping) = true;
                                                    id(is_dimmed) = false;
                                                    id(disp_backlight)->turn_off().perform();
                                                    return;
                                                  }
                                                  if (row == 1 && col == 4) {
                                                    id(ui_mode) = 2;
                                                    id(alert_active) = false;
                                                  } else if (row == 2 && col == 0) {
                                                    id(ui_mode) = 3;
                                                    id(alert_active) = false;
                                                  } else if (row == 2 && col == 4) {
                                                    id(ui_mode) = 4;
                                                    id(alert_active) = false;
                                                  } else if (id(ui_mode) == 4 && row == 6 && col == 6) {
                                                    visualizer::imu_tracker.toggle_zero();
                                                  } else if (id(ui_mode) == 3) {
                                                    bool is_up = (row == 5 && col == 6) || (row == 5 && col == 3);
                                                    int cur = id(dev_cursor);
                                                    cur = is_up ? ((cur + 4) % 5) : ((cur + 1) % 5);
                                                    id(dev_cursor) = cur;
                                                    if (cur < id(dev_scroll)) id(dev_scroll) = cur;
                                                    else if (cur >= id(dev_scroll) + 3) id(dev_scroll) = cur - 2;
                                                    id(alert_active) = false;
                                                  }
                                                  id(m5display).update();
                                            else:
                                              # ===== 第 4 屏 [掌上控家] 按 Enter 回车静默切换开关 =====
                                              - if:
                                                  condition:
                                                    lambda: 'return (id(va_state) == 0 && id(ui_mode) == 3 && row == 6 && col == 6);'
                                                  then:
                                                    - lambda: |-
                                                        const char* eids[5] = {
                                                          "light.living_room_ceiling",
                                                          "light.bedroom_main",
                                                          "light.router_indicator",
                                                          "fan.standing_fan",
                                                          "light.dining_room_ceiling"
                                                        };
                                                        std::string states[5] = {
                                                          id(ha_dev_0).state,
                                                          id(ha_dev_1).state,
                                                          id(ha_dev_2).state,
                                                          id(ha_dev_3).state,
                                                          id(ha_dev_4).state
                                                        };
                                                        int idx = id(dev_cursor);
                                                        if (idx < 0 || idx >= 5) idx = 0;
                                                        std::string st = states[idx];
                                                        if (st == "unavailable" || st == "unknown" || st.empty()) {
                                                          id(target_toggle_entity) = "";
                                                          id(alert_title) = "设备当前离线";
                                                          id(alert_msg) = "该设备断电离线，请先检查物理开关";
                                                          id(alert_start_ms) = millis();
                                                          id(alert_dur_ms) = 1800;
                                                          id(alert_active) = true;
                                                        } else {
                                                          id(target_toggle_entity) = eids[idx];
                                                          id(dev_action_start_ms) = millis();
                                                          id(dev_action_active) = true;
                                                        }
                                                        id(m5display).update();
                                                    - if:
                                                        condition:
                                                          lambda: 'return !id(target_toggle_entity).empty();'
                                                        then:
                                                          - homeassistant.service:
                                                              service: homeassistant.toggle
                                                              data:
                                                                entity_id: !lambda 'return id(target_toggle_entity);'
                                                  else:
                                                    # ===== 其余按键：按当前状态处理（打断 / 停止录音 / 启动对讲）=====
                                                    - if:
                                                        condition:
                                                          lambda: 'return id(va_state) == 3 || id(va_state) == 2;'
                                                        then:
                                                          - lambda: |-
                                                              id(echo_speaker)->stop();
                                                              id(va_state) = 0;
                                                              id(va_status_msg) = "Interrupted";
                                                              id(va_stt_text).clear();
                                                              id(va_reply_text).clear();
                                                              id(dialog_reset_active) = false;
                                                              id(m5display).update();
                                                          - voice_assistant.stop:
                                                        else:
                                                          - if:
                                                              condition:
                                                                lambda: 'return id(va_state) == 1;'
                                                              then:
                                                                # 录音途中再次按下按键：明确取消本次对话并退回待命
                                                                - lambda: |-
                                                                    id(va_state) = 0;
                                                                    id(va_status_msg) = "Cancelled";
                                                                    id(m5display).update();
                                                                - voice_assistant.stop:
                                                              else:
                                                                # 开启语音对讲（支持点按说完停顿自动提交，或按住说完松手自动提交）
                                                                - lambda: |-
                                                                    id(va_stt_text).clear();
                                                                    id(va_reply_text).clear();
                                                                    id(alert_active) = false;
                                                                    id(dialog_reset_active) = false;
                                                                - voice_assistant.start:
                                                                    silence_detection: true

# 官方内置 Bosch BMI270 6轴传感器驱动（自动加载 8KB 官方微码校准，地址 0x69）
motion:
  - platform: bmi270
    id: cardputer_imu
    i2c_id: bus_internal
    address: 0x69
    accelerometer_range: 2G
    accelerometer_odr: 50HZ
    gyroscope_range: 125DPS
    gyroscope_odr: 25HZ
    update_interval: 80ms

spi:
  clk_pin: GPIO36
  mosi_pin: GPIO35
  miso_pin: GPIO39

display:
  platform: mipi_spi
  model: ST7789V
  id: m5display
  cs_pin: GPIO37
  dc_pin: GPIO34
  reset_pin: GPIO33
  dimensions:
    width: 135
    height: 240
    offset_width: 52
    offset_height: 40
  color_order: BGR
  invert_colors: true
  rotation: 90
  data_rate: 40MHz
  update_interval: 100ms
  lambda: |-
    // 0. 硬件级状态机防卡死看门狗 (彻底杜绝任何网络抖动或异常导致的永久卡死)
    uint32_t now_ms = millis();
    int st = id(va_state);
    if (st == 4 && (uint32_t)(now_ms - id(va_state_enter_ms)) > 4000) {
      id(va_state) = 0;
      id(dialog_reset_active) = false;
      st = 0;
    } else if (st == 1 && (uint32_t)(now_ms - id(va_state_enter_ms)) > 25000) {
      id(va_comp)->request_stop();
      id(va_state) = 0;
      st = 0;
    } else if (st == 2 && (uint32_t)(now_ms - id(va_state_enter_ms)) > 30000) {
      id(va_comp)->request_stop();
      id(va_state) = 0;
      st = 0;
    } else if (st == 3 && (uint32_t)(now_ms - id(va_state_enter_ms)) > 45000) {
      id(echo_speaker)->stop();
      id(va_state) = 0;
      st = 0;
    }

    // 0.5 自动节能管理 (水平仪测量模式下自动延长至 3 分钟暗屏 / 5 分钟休眠；异常态也允许休眠)
    if (st == 0 || st == 4) {
      if (id(is_sleeping)) {
        return;
      }
      uint32_t idle = (uint32_t)(now_ms - id(last_activity_ms));
      uint32_t dim_limit = (id(ui_mode) == 4) ? 180000 : 30000;
      uint32_t sleep_limit = (id(ui_mode) == 4) ? 300000 : 120000;
      if (idle > sleep_limit) {
        id(is_sleeping) = true;
        id(disp_backlight)->turn_off().perform();
        return;
      } else if (idle > dim_limit && !id(is_dimmed)) {
        id(is_dimmed) = true;
        id(disp_backlight)->turn_on().set_brightness(0.15f).perform();
      }
    } else {
      id(last_activity_ms) = now_ms;
      if (id(is_dimmed) || id(is_sleeping)) {
        id(is_dimmed) = false;
        id(is_sleeping) = false;
        id(disp_backlight)->turn_on().set_brightness(1.0f).perform();
      }
    }

    // 1. 全屏深色清屏
    it.fill(id(color_bg));

    // 2. 顶部状态栏 (Y: 0 ~ 20)
    it.filled_rectangle(0, 0, 240, 20, id(color_card));
    it.line(0, 20, 240, 20, id(color_card_border));

    if (st == 1) {
      it.filled_circle(10, 10, 3, id(color_cyan));
      it.print(18, 3, id(font_cn), id(color_cyan), "LISTENING 录音中");
    } else if (st == 2) {
      it.filled_circle(10, 10, 3, id(color_yellow));
      it.print(18, 3, id(font_cn), id(color_yellow), "THINKING 处理中");
    } else if (st == 3) {
      it.filled_circle(10, 10, 3, id(color_green));
      it.print(18, 3, id(font_cn), id(color_green), "SPEAKING 播报中");
    } else if (st == 4) {
      it.filled_circle(10, 10, 3, id(color_red));
      std::string elbl = id(va_error_label).empty() ? "对话异常" : id(va_error_label);
      it.print(18, 3, id(font_cn), id(color_red), elbl.c_str());
    } else {
      it.filled_circle(10, 10, 3, id(color_gray));
      it.print(18, 3, id(font_cn), id(color_gray), "READY 本地待命");
    }

    // 中间显示时间
    it.strftime(132, 3, id(font_cn), id(color_gray), "%H:%M:%S", id(sntp_time).now());

    // 右侧精美电池图标 (X: 198 ~ 235)
    int bp = id(batt_pct);
    if (bp > 100) bp = 100;
    if (bp < 0) bp = 0;
    auto b_col = (bp > 50) ? id(color_green) : ((bp > 20) ? id(color_yellow) : id(color_red));
    it.rectangle(198, 4, 28, 12, id(color_gray));
    it.filled_rectangle(226, 7, 2, 6, id(color_gray));
    int b_w = (int)(24.0f * (bp / 100.0f));
    if (b_w > 0) {
      it.filled_rectangle(200, 6, b_w, 8, b_col);
    }

    // 3. 核心主内容区 (Y: 22 ~ 112)
    if (st == 1) {
      // ===== 录音中：真实物理麦克风波形 =====
      visualizer::update_bars(true);

      it.print(24, 25, id(font_cn), id(color_white), "正在倾听... 请直接说话");

      // 绘制 18 根对称音频柱 (从 Y: 64 基线上下展开)
      int start_x = 23;
      int baseline_y = 66;
      for (int i = 0; i < visualizer::NUM_BARS; i++) {
        int h = (int)visualizer::bar_heights[i];
        if (h < 2) h = 2;
        int bar_x = start_x + i * 11;
        it.filled_rectangle(bar_x, baseline_y - h, 7, h * 2, id(color_cyan));
        if (h > 12) {
          it.filled_rectangle(bar_x, baseline_y - h, 7, 3, id(color_green));
          it.filled_rectangle(bar_x, baseline_y + h - 3, 7, 3, id(color_green));
        }
      }

      it.print(16, 96, id(font_cn), id(color_gray), "说完自动提交 / 再按取消");

    } else if (st == 2) {
      // ===== 思考中：秒表计数 + 流光扫描 + 转写文本 =====
      visualizer::update_bars(false);

      float sec = (millis() - visualizer::think_start_ms) / 1000.0f;
      char sec_buf[40];
      snprintf(sec_buf, sizeof(sec_buf), "本地推理中... %.1fs", sec);
      it.print(24, 25, id(font_cn), id(color_yellow), sec_buf);

      // 显示转写出的文字
      if (!id(va_stt_text).empty()) {
        it.filled_rectangle(10, 44, 220, 26, id(color_card));
        it.rectangle(10, 44, 220, 26, id(color_card_border));
        std::string txt = visualizer::truncate_utf8("你: " + id(va_stt_text), 33);
        it.print(16, 49, id(font_cn), id(color_white), txt.c_str());
      } else {
        it.print(30, 49, id(font_cn), id(color_gray), "SenseVoice 极速识别中...");
      }

      // 动态流光雷达扫描条 (Y: 76 ~ 84)
      it.filled_rectangle(20, 78, 200, 6, id(color_card));
      it.rectangle(20, 78, 200, 6, id(color_card_border));
      int scan_x = visualizer::get_scanner_x(160, millis());
      it.filled_rectangle(20 + scan_x, 78, 40, 6, id(color_cyan));

      it.print(30, 96, id(font_cn), id(color_dim_gray), "SenseVoice -> Qwen3-4B");

    } else if (st == 3) {
      // ===== 语音播报中：展示识别原话与双行AI回答 =====
      visualizer::update_bars(false);

      it.filled_rectangle(8, 22, 224, 26, id(color_card));
      it.rectangle(8, 22, 224, 26, id(color_card_border));
      std::string u1, u2;
      visualizer::split_cn_text("你: " + id(va_stt_text), u1, u2, 36);
      it.print(14, 26, id(font_cn), id(color_cyan), u1.c_str());

      it.filled_rectangle(8, 52, 224, 56, id(color_card));
      it.rectangle(8, 52, 224, 56, id(color_card_border));
      std::string a1, a2;
      visualizer::split_cn_text("AI: " + id(va_reply_text), a1, a2, 36);
      it.print(14, 57, id(font_cn), id(color_green), a1.c_str());
      if (!a2.empty()) {
        it.print(14, 76, id(font_cn), id(color_green), a2.c_str());
      }

    } else {
      // ===== 就绪状态 (READY / 4 ERROR) =====
      visualizer::update_bars(false);

      if (id(dialog_reset_active) && (uint32_t)(millis() - id(dialog_reset_start_ms)) >= id(dialog_reset_dur_ms)) {
        id(va_stt_text).clear();
        id(va_reply_text).clear();
        id(va_state) = 0;
        id(dialog_reset_active) = false;
      }

      if (!id(va_stt_text).empty() && !id(va_reply_text).empty()) {
        // 在 5 秒倒计时内保留显示对话卡片 (双行排版)
        it.filled_rectangle(8, 22, 224, 26, id(color_card));
        it.rectangle(8, 22, 224, 26, id(color_card_border));
        std::string u1, u2;
        visualizer::split_cn_text("你: " + id(va_stt_text), u1, u2, 36);
        it.print(14, 26, id(font_cn), id(color_gray), u1.c_str());

        it.filled_rectangle(8, 52, 224, 56, id(color_card));
        it.rectangle(8, 52, 224, 56, id(color_card_border));
        std::string a1, a2;
        visualizer::split_cn_text("AI: " + id(va_reply_text), a1, a2, 36);
        it.print(14, 57, id(font_cn), id(color_green), a1.c_str());
        if (!a2.empty()) {
          it.print(14, 76, id(font_cn), id(color_green), a2.c_str());
        }

        // 倒计时指示微条 (青色逐渐缩短，49.7天无符号差值安全)
        if (id(dialog_reset_active)) {
          uint32_t elapsed = (uint32_t)(millis() - id(dialog_reset_start_ms));
          if (elapsed < id(dialog_reset_dur_ms)) {
            uint32_t rem = id(dialog_reset_dur_ms) - elapsed;
            int w = (int)(224 * rem / id(dialog_reset_dur_ms));
            if (w > 224) w = 224;
            if (w > 0) it.filled_rectangle(8, 110, w, 2, id(color_cyan));
          }
        }
      } else {
        if (id(ui_mode) == 1) {
          // ===== Mode 1: 桌面副屏 + 家庭第二大脑备忘 + 真实路由器网速 =====
          // 左侧：日期星期与最新本地备忘 (X: 8, Y: 24, W: 116, H: 86)
          it.filled_rectangle(8, 24, 116, 86, id(color_card));
          it.rectangle(8, 24, 116, 86, id(color_card_border));
          it.print(14, 28, id(font_cn), id(color_cyan), "[桌面与备忘]");

          auto now_t = id(sntp_time).now();
          const char* wd_cn[] = {"日", "一", "二", "三", "四", "五", "六"};
          int widx = (now_t.day_of_week >= 1 && now_t.day_of_week <= 7) ? (now_t.day_of_week - 1) : 0;
          char date_buf[32];
          snprintf(date_buf, sizeof(date_buf), "%02d月%02d日 周%s", now_t.month, now_t.day_of_month, wd_cn[widx]);
          it.print(14, 46, id(font_cn), id(color_white), date_buf);

          std::string memo = id(ha_legion_memo).state;
          if (memo.empty() || memo == "unknown" || memo == "unavailable") {
            memo = "暂无备忘记录";
          }
          std::string m1, m2;
          visualizer::split_cn_text(memo, m1, m2, 24);
          it.print(14, 67, id(font_cn), id(color_green), m1.c_str());
          if (!m2.empty()) {
            it.print(14, 85, id(font_cn), id(color_green), m2.c_str());
          } else {
            it.print(14, 88, id(font_cn), id(color_dim_gray), "说记一下新增");
          }

          // 右侧：全屋真实网络吞吐与信号 (X: 128, Y: 24, W: 104, H: 86)
          it.filled_rectangle(128, 24, 104, 86, id(color_card));
          it.rectangle(128, 24, 104, 86, id(color_card_border));
          it.print(134, 28, id(font_cn), id(color_yellow), "[家庭网络]");

          float dl = id(ha_router_down).state;
          float ul = id(ha_router_up).state;
          char dl_buf[24], ul_buf[24];
          if (std::isnan(dl)) {
            snprintf(dl_buf, sizeof(dl_buf), "下: -- KB/s");
          } else if (dl >= 1048576.0f) {
            snprintf(dl_buf, sizeof(dl_buf), "下: %.1fM/s", dl / 1048576.0f);
          } else {
            snprintf(dl_buf, sizeof(dl_buf), "下: %.0fK/s", dl / 1024.0f);
          }
          if (std::isnan(ul)) {
            snprintf(ul_buf, sizeof(ul_buf), "上: -- KB/s");
          } else if (ul >= 1048576.0f) {
            snprintf(ul_buf, sizeof(ul_buf), "上: %.1fM/s", ul / 1048576.0f);
          } else {
            snprintf(ul_buf, sizeof(ul_buf), "上: %.0fK/s", ul / 1024.0f);
          }
          it.print(134, 48, id(font_cn), id(color_cyan), dl_buf);
          it.print(134, 68, id(font_cn), id(color_white), ul_buf);

          float rssi = id(cardputer_wifi_rssi).state;
          char w_buf[24];
          if (std::isnan(rssi)) snprintf(w_buf, sizeof(w_buf), "WiFi: --");
          else snprintf(w_buf, sizeof(w_buf), "WiFi: %ddB", (int)rssi);
          it.print(134, 88, id(font_cn), id(color_gray), w_buf);

        } else if (id(ui_mode) == 2) {
          // ===== Mode 2: 掌上 边缘 集群算力指挥台 + 终端真实硬件雷达 =====
          // 左侧：边缘 小模型集群实时算力 (X: 8, Y: 24, W: 122, H: 86)
          it.filled_rectangle(8, 24, 122, 86, id(color_card));
          it.rectangle(8, 24, 122, 86, id(color_card_border));
          it.print(14, 28, id(font_cn), id(color_cyan), "[本地算力集群]");

          float h_cpu = id(ha_legion_cpu).state;
          float h_ram = id(ha_legion_ram).state;
          char c_buf[24], r_buf[24];
          snprintf(c_buf, sizeof(c_buf), "CPU: %s", std::isnan(h_cpu) ? "--" : "");
          if (!std::isnan(h_cpu)) snprintf(c_buf, sizeof(c_buf), "CPU: %.0f%%", h_cpu);
          snprintf(r_buf, sizeof(r_buf), "RAM: %s", std::isnan(h_ram) ? "--" : "");
          if (!std::isnan(h_ram)) snprintf(r_buf, sizeof(r_buf), "RAM: %.0f%%", h_ram);

          it.print(14, 45, id(font_cn), id(color_white), c_buf);
          it.filled_rectangle(74, 50, 50, 5, id(color_bg));
          if (!std::isnan(h_cpu)) {
            int cw = std::max(2, std::min(50, (int)(h_cpu * 0.5f)));
            it.filled_rectangle(74, 50, cw, 5, id(color_cyan));
          }

          it.print(14, 63, id(font_cn), id(color_white), r_buf);
          it.filled_rectangle(74, 68, 50, 5, id(color_bg));
          if (!std::isnan(h_ram)) {
            int rw = std::max(2, std::min(50, (int)(h_ram * 0.5f)));
            it.filled_rectangle(74, 68, rw, 5, id(color_green));
          }

          std::string mdl = id(ha_legion_model).state;
          if (mdl.empty() || mdl == "unknown" || mdl == "unavailable") mdl = "Qwen3-4B";
          mdl = visualizer::truncate_utf8(mdl, 14, false);
          it.print(14, 86, id(font_cn), id(color_yellow), mdl.c_str());

          // 右侧：Cardputer 真实硬件与射频波动 (X: 134, Y: 24, W: 98, H: 86)
          it.filled_rectangle(134, 24, 98, 86, id(color_card));
          it.rectangle(134, 24, 98, 86, id(color_card_border));
          it.print(140, 28, id(font_cn), id(color_yellow), "[终端雷达]");

          uint32_t fh = esp_get_free_heap_size() / 1024;
          float bv = id(batt_adc).state;
          char dev_buf[32];
          snprintf(dev_buf, sizeof(dev_buf), "%uKB %.2fV", (unsigned int)fh, std::isnan(bv) ? 0.0f : bv);
          it.print(140, 45, id(font_cn), id(color_white), dev_buf);

          uint32_t up_min = (uint32_t)(millis() / 60000);
          char up_buf[24];
          snprintf(up_buf, sizeof(up_buf), "运行: %uh%um", (unsigned int)(up_min / 60), (unsigned int)(up_min % 60));
          it.print(140, 62, id(font_cn), id(color_gray), up_buf);

          // 真实 Wi-Fi RSSI 历史波动折线图 (X: 140 ~ 226, Y: 82 ~ 103)
          for (int i = 0; i < visualizer::RSSI_HISTORY_LEN - 1; i++) {
            float r1 = visualizer::rssi_history[i];
            float r2 = visualizer::rssi_history[i + 1];
            int y1 = 103 - (int)((r1 + 90.0f) * 20.0f / 60.0f);
            int y2 = 103 - (int)((r2 + 90.0f) * 20.0f / 60.0f);
            if (y1 < 83) y1 = 83; if (y1 > 103) y1 = 103;
            if (y2 < 83) y2 = 83; if (y2 > 103) y2 = 103;
            it.line(140 + i * 5, y1, 140 + (i + 1) * 5, y2, id(color_cyan));
          }

        } else if (id(ui_mode) == 3) {
          // ===== Mode 3: 掌上家电遥控面板 (方向键选设备 + 回车静默秒开关) =====
          it.print(8, 22, id(font_cn), id(color_cyan), "[掌上控家]");
          it.print(88, 22, id(font_cn), id(color_dim_gray), ";/.上下  回车开关");

          const char* dev_names[5] = {
            "客厅吸顶灯",
            "主照明 大灯",
            "路由器指示灯",
            "直流变频落地扇",
            "吸顶灯 (分路)"
          };
          std::string dev_states[5] = {
            id(ha_dev_0).state,
            id(ha_dev_1).state,
            id(ha_dev_2).state,
            id(ha_dev_3).state,
            id(ha_dev_4).state
          };

          int cur = id(dev_cursor);
          if (cur < 0 || cur >= 5) cur = 0;
          int scr = id(dev_scroll);
          if (scr < 0) scr = 0;
          if (scr > 2) scr = 2;

          bool flash_act = false;
          if (id(dev_action_active)) {
            if ((uint32_t)(millis() - id(dev_action_start_ms)) < 350) {
              flash_act = true;
            } else {
              id(dev_action_active) = false;
            }
          }

          for (int r = 0; r < 3; r++) {
            int idx = scr + r;
            if (idx >= 5) break;
            int ry = 40 + r * 24;
            bool sel = (idx == cur);

            it.filled_rectangle(8, ry, 220, 21, id(color_card));
            if (sel) {
              auto border_c = flash_act ? id(color_yellow) : id(color_cyan);
              it.rectangle(8, ry, 220, 21, border_c);
              it.filled_rectangle(10, ry + 4, 3, 13, border_c);
            } else {
              it.rectangle(8, ry, 220, 21, id(color_card_border));
            }

            it.print(18, ry + 2, id(font_cn), sel ? id(color_white) : id(color_gray), dev_names[idx]);

            std::string dst = dev_states[idx];
            if (dst == "on") {
              it.filled_rectangle(174, ry + 3, 48, 15, id(color_green));
              it.print(185, ry + 2, id(font_cn), id(color_bg), "开启");
            } else if (dst == "off") {
              it.rectangle(174, ry + 3, 48, 15, id(color_dim_gray));
              it.print(185, ry + 2, id(font_cn), id(color_gray), "关闭");
            } else {
              it.rectangle(174, ry + 3, 48, 15, id(color_card_border));
              it.print(185, ry + 2, id(font_cn), id(color_dim_gray), "离线");
            }
          }

          // 右侧视窗滚动指示条 (3/5)
          it.filled_rectangle(232, 40, 3, 69, id(color_card));
          it.filled_rectangle(232, 40 + scr * 14, 3, 41, id(color_cyan));

        } else if (id(ui_mode) == 4) {
          // ===== Mode 4: BMI270 高精度双轴气泡电子水平仪 (平放圆靶 + 立边/铅垂管状尺自适应) =====
          auto &imu = visualizer::imu_tracker;
          bool zeroed = imu.zero_enabled;

          if (imu.is_flat_mode()) {
            // --- 形态 A：平放桌面 / 顶面贴靠 -> 双轴同心圆水准靶盘 ---
            float roll = imu.get_roll_deg();
            float pitch = imu.get_pitch_deg();
            float tilt = std::sqrt(roll * roll + pitch * pitch);
            bool is_lvl = (tilt <= 0.6f);
            auto status_col = is_lvl ? id(color_green) : ((tilt <= 3.0f) ? id(color_cyan) : id(color_yellow));

            // 左侧精确角度读数卡片 (X: 8, Y: 24, W: 122, H: 86)
            it.filled_rectangle(8, 24, 122, 86, id(color_card));
            it.rectangle(8, 24, 122, 86, id(color_card_border));
            it.print(14, 27, id(font_cn), zeroed ? id(color_yellow) : id(color_cyan),
                     zeroed ? "[双轴·相对零点]" : "[双轴水平仪]");

            char rx_buf[28], py_buf[28];
            snprintf(rx_buf, sizeof(rx_buf), "左右X: %+5.1f°", roll);
            snprintf(py_buf, sizeof(py_buf), "前后Y: %+5.1f°", pitch);
            it.print(14, 46, id(font_cn), id(color_white), rx_buf);
            it.print(14, 65, id(font_cn), id(color_white), py_buf);

            if (is_lvl) {
              it.filled_rectangle(14, 87, 50, 16, id(color_green));
              it.print(18, 86, id(font_cn), id(color_bg), "已水平");
            } else {
              it.rectangle(14, 87, 50, 16, status_col);
              it.print(18, 86, id(font_cn), status_col, (tilt <= 3.0f) ? "微倾斜" : "未水平");
            }
            it.print(69, 87, id(font_cn), id(color_dim_gray), zeroed ? "回车复原" : "回车归零");

            // 右侧双轴圆靶水准泡 (X: 134, Y: 24, W: 98, H: 86)
            it.filled_rectangle(134, 24, 98, 86, id(color_card));
            it.rectangle(134, 24, 98, 86, id(color_card_border));
            int cx = 183, cy = 67;
            it.line(cx - 37, cy, cx + 37, cy, id(color_card_border));
            it.line(cx, cy - 37, cx, cy + 37, id(color_card_border));
            it.circle(cx, cy, 37, id(color_gray));
            it.circle(cx, cy, 20, id(color_card_border));
            it.circle(cx, cy, 8, is_lvl ? id(color_green) : id(color_cyan));

            // 模拟真实气泡物理方向：哪侧抬高，水准泡向哪侧浮起
            float dx = -roll * 2.4f;
            float dy = pitch * 2.4f;
            float dist = std::sqrt(dx * dx + dy * dy);
            if (dist > 30.0f) {
              dx = dx * 30.0f / dist;
              dy = dy * 30.0f / dist;
            }
            int bx = cx + (int)std::round(dx);
            int by = cy + (int)std::round(dy);
            it.filled_circle(bx, by, 6, status_col);
            it.filled_circle(bx - 2, by - 2, 1, id(color_white));

          } else {
            // --- 形态 B：竖立底边 / 侧边贴靠测量 -> 管状水准尺 / 铅垂尺 ---
            float edge = imu.get_edge_deg();
            float abs_e = std::abs(edge);
            bool is_lvl = (abs_e <= 0.6f);
            bool plumb = imu.is_plumb_mode();
            auto status_col = is_lvl ? id(color_green) : ((abs_e <= 3.0f) ? id(color_cyan) : id(color_yellow));

            it.filled_rectangle(8, 24, 224, 86, id(color_card));
            it.rectangle(8, 24, 224, 86, id(color_card_border));

            it.print(14, 28, id(font_cn), zeroed ? id(color_yellow) : id(color_cyan),
                     plumb ? "[侧边铅垂尺]" : "[立边水平尺]");

            char ang_buf[32];
            const char* ok_lbl = plumb ? "[已垂直]" : "[已水平]";
            snprintf(ang_buf, sizeof(ang_buf), "%+5.1f° %s", edge, is_lvl ? ok_lbl : "[调整中]");
            it.print(118, 28, id(font_cn), status_col, ang_buf);

            // 横向仿真玻璃水准管 (X: 22 ~ 218, Y: 53, W: 196, H: 26)
            it.filled_rectangle(22, 53, 196, 26, id(color_bg));
            it.rectangle(22, 53, 196, 26, id(color_gray));
            // 中央双基准刻度线与辅助刻度线
            it.line(106, 53, 106, 79, is_lvl ? id(color_green) : id(color_cyan));
            it.line(134, 53, 134, 79, is_lvl ? id(color_green) : id(color_cyan));
            it.line(70, 58, 70, 74, id(color_card_border));
            it.line(170, 58, 170, 74, id(color_card_border));

            float shift = -edge * 4.5f;
            if (shift < -84.0f) shift = -84.0f;
            if (shift > 84.0f) shift = 84.0f;
            int bx = 120 + (int)std::round(shift) - 11;
            it.filled_rectangle(bx, 57, 22, 18, status_col);
            it.filled_rectangle(bx + 3, 59, 6, 2, id(color_white));

            it.print(14, 87, id(font_cn), id(color_gray), plumb ? "短边贴墙测垂直" : "长边贴物测水平");
            it.print(138, 87, id(font_cn), id(color_dim_gray), zeroed ? "回车恢复基准" : "回车相对归零");
          }

        } else {
          // ===== Mode 0: 赛博心跳脉冲呼吸线 (平滑连续折线) =====
          it.filled_rectangle(14, 26, 212, 82, id(color_card));
          it.rectangle(14, 26, 212, 82, id(color_card_border));
          it.print(32, 33, id(font_cn), id(color_white), "点按对讲 / 说完自动提交");
          it.print(26, 52, id(font_cn), id(color_dim_gray), "-/+ 调音量   ESC/TAB 切屏");

          int baseline_y = 83;
          int prev_x = 24;
          int prev_y = baseline_y;
          for (int x = 24; x <= 216; x += 4) {
            float dist = std::abs(x - 120) / 96.0f;
            float wave = std::sin((millis() / 260.0f) + (x * 0.085f)) * (1.0f - dist) * 8.0f;
            int cy = baseline_y + (int)wave;
            if (x > 24) {
              it.line(prev_x, prev_y, x, cy, id(color_cyan));
            }
            prev_x = x;
            prev_y = cy;
          }
        }
      }
    }

    // 4. 底部栏 (Y: 114 ~ 134)
    it.filled_rectangle(0, 114, 240, 21, id(color_card));
    it.line(0, 114, 240, 114, id(color_card_border));
    it.print(6, 117, id(font_cn), id(color_dim_gray), "192.168.1.100");
    char v_str[24];
    snprintf(v_str, sizeof(v_str), "音量: %d%%", (int)(id(cardputer_vol) * 100.0f + 0.5f));
    it.print(115, 117, id(font_cn), id(color_yellow), v_str);
    if (id(ui_mode) == 1) {
      it.print(175, 117, id(font_cn), id(color_green), "[2/5 副屏]");
    } else if (id(ui_mode) == 2) {
      it.print(175, 117, id(font_cn), id(color_yellow), "[3/5 集群]");
    } else if (id(ui_mode) == 3) {
      it.print(175, 117, id(font_cn), id(color_cyan), "[4/5 控家]");
    } else if (id(ui_mode) == 4) {
      it.print(175, 117, id(font_cn), id(color_green), "[5/5 水平]");
    } else {
      it.print(175, 117, id(font_cn), id(color_cyan), "[1/5 语音]");
    }

    // 5. 音量浮层 HUD (按 - / + 键时弹出，49.7天溢出安全)
    if (id(vol_hud_active)) {
      if ((uint32_t)(millis() - id(vol_hud_start_ms)) < 2000) {
        it.filled_rectangle(35, 40, 170, 48, id(color_card));
        it.rectangle(35, 40, 170, 48, id(color_cyan));
        int vol_pct = (int)(id(cardputer_vol) * 100.0f + 0.5f);
        char hud_buf[32];
        snprintf(hud_buf, sizeof(hud_buf), "扬声器音量: %d%%", vol_pct);
        it.print(48, 46, id(font_cn), id(color_white), hud_buf);
        it.filled_rectangle(50, 68, 140, 8, id(color_bg));
        it.filled_rectangle(50, 68, (int)(140 * id(cardputer_vol)), 8, id(color_cyan));
      } else {
        id(vol_hud_active) = false;
      }
    }
    // 6. 反向主动唤醒警报 / 宏操作弹窗 HUD
    if (id(alert_active)) {
      if ((uint32_t)(millis() - id(alert_start_ms)) < id(alert_dur_ms)) {
        it.filled_rectangle(14, 28, 212, 76, id(color_card));
        it.rectangle(14, 28, 212, 76, id(color_yellow));
        it.filled_rectangle(14, 28, 212, 20, id(color_yellow));
        it.print(22, 31, id(font_cn), id(color_bg), id(alert_title).c_str());
        std::string al1, al2;
        visualizer::split_cn_text(id(alert_msg), al1, al2, 32);
        it.print(22, 54, id(font_cn), id(color_white), al1.c_str());
        if (!al2.empty()) {
          it.print(22, 74, id(font_cn), id(color_cyan), al2.c_str());
        }
      } else {
        id(alert_active) = false;
      }
    }


voice_assistant:
  id: va_comp
  microphone: external_mic
  speaker: echo_speaker
  noise_suppression_level: 2
  auto_gain: 15dBFS
  volume_multiplier: 1.0
  conversation_timeout: 120s
  on_start:
    - lambda: |-
        id(va_state) = 1;
        id(va_state_enter_ms) = millis();
        id(va_status_msg) = "Listening";
        id(dialog_reset_active) = false;
  on_listening:
    - lambda: |-
        id(va_state) = 1;
        id(va_state_enter_ms) = millis();
  on_stt_vad_end:
    - lambda: |-
        id(va_state) = 2;
        id(va_state_enter_ms) = millis();
        visualizer::think_start_ms = millis();
  on_stt_end:
    - lambda: |-
        id(va_state) = 2;
        id(va_state_enter_ms) = millis();
        id(va_stt_text) = x;
  on_tts_start:
    - lambda: |-
        id(va_state) = 3;
        id(va_state_enter_ms) = millis();
        id(va_reply_text) = x;
  on_end:
    - lambda: |-
        id(va_state) = 0;
        id(dialog_reset_start_ms) = millis();
        id(dialog_reset_dur_ms) = 5000;
        id(dialog_reset_active) = true;
  on_error:
    - lambda: |-
        id(echo_speaker)->stop();
        id(va_state) = 4;
        id(va_state_enter_ms) = millis();
        id(va_status_msg) = "Error";
        if (code.find("no-text") != std::string::npos || code.find("stt") != std::string::npos) {
          id(va_error_label) = "未听清请重试";
        } else if (code.find("timeout") != std::string::npos) {
          id(va_error_label) = "响应超时已复位";
        } else if (code.find("not-connected") != std::string::npos) {
          id(va_error_label) = "中枢未连接";
        } else {
          id(va_error_label) = "对话异常请重试";
        }
        id(dialog_reset_start_ms) = millis();
        id(dialog_reset_dur_ms) = 3000;
        id(dialog_reset_active) = true;

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Cardputer Screen Backlight"
    id: disp_backlight
    restore_mode: ALWAYS_ON

text_sensor:
  - platform: homeassistant
    id: ha_legion_model
    entity_id: sensor.ai_legion_model
    internal: true
  - platform: homeassistant
    id: ha_legion_memo
    entity_id: sensor.ai_legion_memo
    internal: true
  - platform: homeassistant
    id: ha_dev_0
    entity_id: light.living_room_ceiling
    internal: true
  - platform: homeassistant
    id: ha_dev_1
    entity_id: light.bedroom_main
    internal: true
  - platform: homeassistant
    id: ha_dev_2
    entity_id: light.router_indicator
    internal: true
  - platform: homeassistant
    id: ha_dev_3
    entity_id: fan.standing_fan
    internal: true
  - platform: homeassistant
    id: ha_dev_4
    entity_id: light.dining_room_ceiling
    internal: true

sensor:
  - platform: wifi_signal
    id: cardputer_wifi_rssi
    internal: true
    update_interval: 1s
    on_value:
      - lambda: |-
          visualizer::record_rssi(x, millis());

  - platform: homeassistant
    id: ha_legion_cpu
    entity_id: sensor.ai_legion_cpu
    internal: true

  - platform: homeassistant
    id: ha_legion_ram
    entity_id: sensor.ai_legion_ram
    internal: true

  - platform: homeassistant
    id: ha_router_down
    entity_id: sensor.router_download_speed
    internal: true

  - platform: homeassistant
    id: ha_router_up
    entity_id: sensor.router_upload_speed
    internal: true

  - platform: adc
    pin: GPIO10
    id: batt_adc
    name: "Cardputer Battery Voltage"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 2.0
    on_value:
      - lambda: |-
          float v = x;
          int p = 0;
          if (v >= 4.15f) p = 100;
          else if (v <= 3.45f) p = 0;
          else p = (int)((v - 3.45f) / (4.15f - 3.45f) * 100.0f);
          id(batt_pct) = p;

number:
  - platform: template
    name: "Cardputer Speaker Volume"
    id: cardputer_volume_ctrl
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.75
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(cardputer_vol) = x;
          id(cardputer_adv_dac)->set_volume(x);
          id(vol_hud_start_ms) = millis();
          id(vol_hud_active) = true;
          id(m5display).update();
