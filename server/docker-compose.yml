version: '3.8'

services:
  # 1. Home Assistant Core (智能家居控制中枢)
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    # Linux 推荐开启 network_mode: host 以获得最佳 mDNS 设备自动发现体验；
    # macOS / Windows 用户请保持使用下方的 ports 端口映射。
    # network_mode: host
    ports:
      - "8123:8123"
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}

  # 2. Wyoming ASR 离线语音识别（默认提供 SenseVoiceSmall INT8 100ms 极速方案；若需旧版 Whisper 可自行替换）
  sensevoice:
    image: python:3.11-slim
    container_name: wyoming-sensevoice
    restart: unless-stopped
    working_dir: /app
    ports:
      - "10300:10300"
    volumes:
      - ./ai-legion:/app:ro
      - ./sensevoice-models:/models/sensevoice:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SENSEVOICE_MODEL_DIR=/models/sensevoice
      - SENSEVOICE_URI=tcp://0.0.0.0:10300
    command: >
      sh -c "pip install --no-cache-dir sherpa-onnx wyoming numpy &&
             python wyoming_sensevoice.py"

  # 3. Wyoming Piper (本地高质量语音合成 TTS)
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    command:
      - --voice
      - zh_CN-huayan-medium
      - --uri
      - tcp://0.0.0.0:10200
      - --data-dir
      - /data
    volumes:
      - ./piper-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}

  # 4. Ollama (可选外部推理引擎；若宿主机直载 GGUF 则无需启用)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    environment:
      - TZ=${TZ:-Asia/Shanghai}

  # 5. AI Legion v2.3 算力控制塔与第二大脑网关
  ai-legion:
    build: ./ai-legion
    container_name: ai-legion
    restart: unless-stopped
    ports:
      - "8096:8096"
    depends_on:
      - homeassistant
      - ollama
    environment:
      - HA_URL=http://homeassistant:8123
      - HA_TOKEN=${HA_TOKEN}
      - OLLAMA_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen3:4b}
      - PORT=8096
    volumes:
      - ./ai-legion-data:/app/data
